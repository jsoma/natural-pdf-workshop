[project]
name = "natural-pdf-workshop"
version = "0.1.0"
description = "Workshop notebooks for extracting data from PDFs with Natural PDF."
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "natural-pdf[all]>=0.7.0",
    "openai>=2.0.0",
    "pandas>=2.3.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.0",
    "rapidocr>=3.8.0",
    "surya-ocr>=0.17.0",
]

[tool.uv]
package = false
exclude-newer-package = { "natural-pdf" = "2026-08-02T00:00:00Z" }
